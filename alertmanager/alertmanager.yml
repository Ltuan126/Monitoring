# Alertmanager configuration
# Routes alerts by `severity` label (warning / critical).
# Grafana connects to Alertmanager as a datasource to display alerts in its Alerting UI.

global:
  resolve_timeout: 5m

route:
  # Group alerts by alertname, job and instance to avoid noisy single alerts
  group_by: ['alertname', 'job', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

  routes:
    - match:
        severity: critical
      receiver: critical-alerts
      continue: false

    - match:
        severity: warning
      receiver: warning-alerts
      continue: false

  # default receiver if no route matches
  receiver: warning-alerts

inhibit_rules:
  # If a critical alert is firing, inhibit corresponding warning for same alertname/job/instance
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job', 'instance']

receivers:
  - name: warning-alerts
  - name: critical-alerts
